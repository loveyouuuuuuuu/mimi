<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ذكرياتنا 💙</title>
  <style>
    body {
      margin: 0;
      font-family: 'Amiri', serif;
      background: #89CFF0; /* Baby Blue */
      color: #333;
    }
    section {
      min-height: 100vh; /* كل قسم يأخذ ارتفاع شاشة كاملة */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 30px;
      margin: 40px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
    section:nth-child(even) {
      background: #E6F4FA; /* تدرج أزرق فاتح */
    }
    h2 {
      color: #FF69B4;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 15px 0;
    }
    img {
      max-width: 80%;
      border-radius: 15px;
      margin: 20px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .audio-player {
      margin-top: 15px;
    }
    audio {
      width: 250px;
    }
  </style>
</head>
<body>

  <!-- الصفحة الأولى -->
  <section>
    <h2>الصفحة الأولى 💙</h2>
    <img src="https://picsum.photos/500/300?random=1" alt="صورة 1">
    <p>هنا تكتب كلماتك النابعة من قلبك... 🌹</p>
    <div class="audio-player">
      <audio controls>
        <source src="music1.mp3" type="audio/mp3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    </div>
  </section>

  <!-- الصفحة الثانية -->
  <section>
    <h2>الصفحة الثانية 💕</h2>
    <img src="https://picsum.photos/500/300?random=2" alt="صورة 2">
    <p>وهنا تضيف ذكرياتك الجميلة... ✨</p>
    <div class="audio-player">
      <audio controls>
        <source src="music2.mp3" type="audio/mp3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    </div>
  </section>

  <!-- الصفحة الثالثة -->
  <section>
    <h2>الصفحة الثالثة 🌸</h2>
    <img src="https://picsum.photos/500/300?random=3" alt="صورة 3">
    <p>وهنا رسالة أخرى بخط يدك الجميل ❤️</p>
    <div class="audio-player">
      <audio controls>
        <source src="music3.mp3" type="audio/mp3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    </div>
  </section>

</body>
</html>
