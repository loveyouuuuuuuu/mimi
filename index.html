<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love U 💙</title>
  <style>
    html {
      scroll-behavior: smooth; /* انسيابية */
    }
    body {
      margin: 0;
      font-family: 'Amiri', serif;
      background: #89CFF0; /* Baby Blue */
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #89CFF0, #FFB6C1);
      padding: 40px 20px;
      text-align: center;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header h1 {
      margin: 0 0 10px 0;
      font-size: 2em;
    }
    #daysCounter {
      font-size: 1.4em;
      font-weight: bold;
    }
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 30px;
      margin: 40px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
    section:nth-child(even) {
      background: #E6F4FA;
    }
    h2 {
      color: #FF69B4;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 15px 0;
    }
    .images {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .images img {
      max-width: 45%;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .audio-player {
      margin-top: 15px;
    }
    audio {
      width: 250px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Love U 💙</h1>
    <div id="daysCounter">...</div>
  </header>

  <!-- الصفحة الأولى -->
  <section>
    <h2>الصفحة الأولى 💙</h2>
    <div class="images">
      <img src="https://picsum.photos/400/300?random=1" alt="صورة 1">
      <img src="https://picsum.photos/400/300?random=2" alt="صورة 2">
    </div>
    <p>هنا تكتب كلماتك النابعة من قلبك... 🌹</p>
    <div class="audio-player">
      <audio controls>
        <source src="music1.mp3" type="audio/mp3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    </div>
  </section>

  <!-- الصفحة الثانية -->
  <section>
    <h2>الصفحة الثانية 💕</h2>
    <div class="images">
      <img src="https://picsum.photos/400/300?random=3" alt="صورة 3">
      <img src="https://picsum.photos/400/300?random=4" alt="صورة 4">
    </div>
    <p>ذكريات جميلة أخرى ✨</p>
    <div class="audio-player">
      <audio controls>
        <source src="music2.mp3" type="audio/mp3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    </div>
  </section>

  <!-- يمكنك نسخ القسم أعلاه وتكراره لصفحات أخرى -->

  <script>
    // عداد الأيام منذ 27 أوت 2024
    function updateCounter() {
      const startDate = new Date('2024-08-27'); // تاريخ البداية
      const now = new Date();
      const diffTime = now - startDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('daysCounter').textContent =
        `مرت ${diffDays} يومًا منذ 27 أوت 2024 ❤️`;
    }
    updateCounter();
    // تحديث تلقائي كل يوم
    setInterval(updateCounter, 1000 * 60 * 60); // يحدث كل ساعة (يكفي)
  </script>

</body>
</html>
