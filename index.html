<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love U</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.site.png" />

  <!-- Police Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      direction: rtl;
      font-family: 'Tajawal', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-top: 80px; /* pour ne pas que le header couvre le contenu */
    }

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 25px;
      z-index: 1000;
      color: #ffffff;
      border-bottom: 1px solid #222; /* plus discret que le gris clair */
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.3rem;
      color: #ffffff;
    }

    header .logo img {
      height: 38px;
    }

    #daysCounter {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.50);
      font-weight: 700;
      color: #ffffff; 
      font-size: 1.15rem;
    }

    @media (max-width: 600px) {
      #daysCounter {
        font-size: 1rem;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo.site.png" alt="شعار الموقع">
      <span>دلوعتي <span style="color:red;">❤️</span></span>
    </div>
  </header>

  <!-- Compteur de jours -->
  <div id="daysCounter">...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('daysCounter');
      const start = new Date(2024, 7, 27, 10, 0, 0); // Date de départ

      function updateCounter() {
        const now = new Date();
        const msPerDay = 24 * 60 * 60 * 1000;
        let days = Math.floor((now - start) / msPerDay);
        if (days < 0) days = 0;
        el.textContent = `مضى ${days} يوم على فراقنا`;
      }

      updateCounter();
      setInterval(updateCounter, 1000);
    });
  </script>

</body>
</html>
