<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love U</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      direction: rtl;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #121212;
    }

    ::-webkit-scrollbar-thumb {
      background: #666;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #888;
    }

    /* Body fixed – no scroll */
    body {
      background: #000;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      overflow: hidden; /* منع السكرول عن البودي */
    }

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 60px;
      padding: 10px 25px;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      border-bottom: 1px solid #222;
      z-index: 1000;
    }

    header .logo img {
      height: 38px;
    }

    /* CONTENT SCROLL AREA */
    .content {
      position: fixed;
      top: 60px;        /* نفس ارتفاع الهيدر */
      right: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto; /* السكرول هنا فقط */
      overflow-x: hidden;
      padding-right: 25px; /* الآن نفس مسافة اللوغو */
    }

    main {
      width: 850px;
      margin: 20px auto;
      padding: 20px 20px 100px 20px;
      text-align: right;
      line-height: 1.9;
    }

    main h2 {
      color: #ff4d4d;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    main h3 {
      color: #ffd4d4;
      margin: 40px 0 10px;
      font-size: 1.4rem;
    }

    blockquote {
      border-right: 3px solid #ff4d4d;
      padding-right: 15px;
      margin: 25px 0;
      color: #ccc;
      font-style: italic;
    }

    #daysCounter {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      background: rgba(0,0,0,0.85);
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1.15rem;
      z-index: 9999;
    }

    @media (max-width: 900px) {
      main {
        width: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.site.png">
    <span>دلوعتي <span style="color:red;">❤️</span></span>
  </div>
</header>

<div class="content">
  <main>
    <h2>الحب: جوهر الوجود وملاذ الروح</h2>

    <p>الحب، تلك الكلمة الصغيرة...</p>

    <h3>الحب فطرة لا تُكتسب</h3>
    <p>يولد الإنسان...</p>

    <h3>أوجه الحب وتجلّياته</h3>
    <p>ليس الحب نوعاً واحداً...</p>

    <blockquote>
      “زدني بفرط الحب فيك تحيّرا...”
    </blockquote>

    <h3>الحب كقوة خالقة</h3>
    <p>الحب ليس شعوراً عابراً...</p>
  </main>
</div>

<div id="daysCounter">...</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('daysCounter');
    const start = new Date(2024, 7, 27, 10, 0, 0);

    function updateCounter() {
      const now = new Date();
      const days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      el.textContent = `مضى ${days} يوم على فراقنا`;
    }

    updateCounter();
    setInterval(updateCounter, 1000);
  });
</script>

</body>
</html>
