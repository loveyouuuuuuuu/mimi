<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love U 💙</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.site.png" />

  <!-- خط Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Reset بسيط */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: #ffffff; /* خلفية بيضاء */
      color: #000000; /* نص أسود */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 20px;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }

    /* شعار أعلى اليسار */
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
    }

    section {
      min-height: calc(100vh - 60px);
      background: #ffffff; /* خلفية بيضاء */
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
    }

    h2 {
      color: #000000; /* نص أسود */
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 18px;
      text-align: center;
      max-width: 820px;
      color: #000000; /* نص أسود */
    }

    .audio-player audio { width: 280px; }

    /* العداد — ثابت في أسفل الشاشة في الوسط */
    #daysCounter {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      z-index: 9999;
      background: rgba(255,255,255,0.95);
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      font-weight: 700;
      color: #000000; /* نص أسود */
      font-size: 1.15rem;
    }

    @media (max-width: 600px) {
      .audio-player audio { width: 200px; }
      section { padding: 26px; border-radius: 14px; }
      #daysCounter { font-size: 1rem; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- شعار أعلى اليسار -->
    <img src="logo.site.png" alt="Logo" class="logo">

    <section id="page1">
      <h2>الصفحة الأولى 💙</h2>
      <p>هنا كلماتك الخاصة بالصفحة الأولى... يمكنك تعديل النص والصور كما تشاء.</p>
      <div class="audio-player">
        <audio controls>
          <source src="music1.mp3" type="audio/mp3">
          متصفحك لا يدعم تشغيل الصوت.
        </audio>
      </div>
    </section>

    <section id="page2">
      <h2>الصفحة الثانية 💕</h2>
      <p>هنا كلمات الصفحة الثانية... ضع الموسيقى لاحقًا عندما تكون جاهزة.</p>
    </section>

    <section id="page3">
      <h2>الصفحة الثالثة 🌸</h2>
      <p>هنا كلمات الصفحة الثالثة...</p>
    </section>

    <section id="page4">
      <h2>الصفحة الرابعة 🌟</h2>
      <p>هنا كلمات الصفحة الرابعة...</p>
    </section>

  </div>

  <div id="daysCounter">...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('daysCounter');
      const start = new Date(2024, 7, 27, 10, 0, 0);

      function updateCounter() {
        const now = new Date();
        const msPerDay = 24 * 60 * 60 * 1000;
        let days = Math.floor((now - start) / msPerDay);
        if (days < 0) days = 0;
        el.textContent = `مضى ${days} يوم على فراقنا`;
      }

      updateCounter();
      setInterval(updateCounter, 1000);
    });
  </script>
</body>
</html>
