<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love U</title>

  <link rel="icon" type="image/png" href="logo.site.png" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow-x: hidden; /* لا تمرير أفقي نهائي */
      scroll-behavior: smooth;
      background: #000; /* الخلفية السوداء */
    }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      color: #000;
      padding-top: 80px;
    }

    /* الهيدر */
    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: flex-start; /* الشعار على اليسار */
      padding: 10px 25px;
      z-index: 1000;
      color: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.3rem;
      color: #ffffff;
    }

    header .logo img {
      height: 38px;
    }

    /* الأقسام */
    section {
      width: 100%; /* تغطي كامل الشاشة بدون تجاوز */
      background: #fff;
      margin: 70px 0; /* مسافة بين الصفحات */
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 60px 20px;
    }

    /* المحتوى داخل كل صفحة */
    .content {
      max-width: 900px; /* المحتوى محدود العرض، لكن الخلفية بيضاء كاملة */
      text-align: center;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 18px;
      color: #000;
    }

    #daysCounter {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.50);
      font-weight: 700;
      color: #ffffff; 
      font-size: 1.15rem;
    }

    @media (max-width: 600px) {
      section { margin: 40px 0; border-radius: 0; padding: 40px 10px; }
      #daysCounter { font-size: 1rem; padding: 10px 14px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo.site.png" alt="شعار الموقع">
      <span>دلوعتي <span style="color:red;">❤️</span></span>
    </div>
  </header>

  <!-- الأقسام -->
  <section id="page1">
    <div class="content">
      <h2>الصفحة الأولى</h2>
      <p>هنا كلماتك الخاصة بالصفحة الأولى... يمكنك تعديل النص والصور كما تشاء.</p>
    </div>
  </section>

  <section id="page2">
    <div class="content">
      <h2>الصفحة الثانية</h2>
      <p>هنا كلمات الصفحة الثانية... ضع الموسيقى لاحقًا عندما تكون جاهزة.</p>
    </div>
  </section>

  <section id="page3">
    <div class="content">
      <h2>الصفحة الثالثة</h2>
      <p>هنا كلمات الصفحة الثالثة...</p>
    </div>
  </section>

  <section id="page4">
    <div class="content">
      <h2>الصفحة الرابعة</h2>
      <p>هنا كلمات الصفحة الرابعة...</p>
    </div>
  </section>

  <div id="daysCounter">...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('daysCounter');
      const start = new Date(2024, 7, 27, 10, 0, 0);

      function updateCounter() {
        const now = new Date();
        const msPerDay = 24 * 60 * 60 * 1000;
        let days = Math.floor((now - start) / msPerDay);
        if (days < 0) days = 0;
        el.textContent = `مضى ${days} يوم على فراقنا`;
      }

      updateCounter();
      setInterval(updateCounter, 1000);
    });
  </script>

</body>
</html>
